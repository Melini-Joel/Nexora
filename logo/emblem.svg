<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1830"/>
      <stop offset="0.45" stop-color="#2a2f5a"/>
      <stop offset="0.72" stop-color="#b8564a"/>
      <stop offset="0.86" stop-color="#f2a450"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5a66"/>
      <stop offset="1" stop-color="#0a2230"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="0.5" stop-color="#e58a3a"/>
      <stop offset="1" stop-color="#ffcf7a"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f3d3a"/>
      <stop offset="0.5" stop-color="#1f3d3a"/>
      <stop offset="0.5" stop-color="#132826"/>
      <stop offset="1" stop-color="#132826"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="206"/></clipPath>
  </defs>

  <!-- Fondo y anillo -->
  <circle cx="256" cy="256" r="246" fill="#0a131d"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
    <!-- Estrellas -->
    <g fill="#fff4dc">
      <circle cx="150" cy="120" r="2.6"/><circle cx="196" cy="88" r="1.8"/><circle cx="330" cy="104" r="2.2"/>
      <circle cx="372" cy="150" r="1.6"/><circle cx="118" cy="176" r="1.6"/><circle cx="300" cy="74" r="1.5"/>
      <circle cx="400" cy="210" r="1.4"/>
    </g>
    <!-- Sol poniéndose -->
    <circle cx="384" cy="322" r="54" fill="#ffc46a" opacity="0.55"/>
    <circle cx="384" cy="322" r="42" fill="#ffe2a0"/>
    <!-- Montaña trasera -->
    <path d="M40 330 L170 214 L222 258 L262 230 L340 300 L470 330 Z" fill="#2c4f53"/>
    <!-- Pico principal -->
    <path d="M120 330 L256 150 L392 330 Z" fill="url(#peak)"/>
    <path d="M256 150 L218 200 L236 194 L250 210 L262 192 L280 204 L294 200 Z" fill="#eef3f6"/>
    <path d="M256 150 L294 200 L280 204 L262 192 Z" fill="#b9c7d2"/>
    <!-- Pinos -->
    <g fill="#0c1d1b">
      <path d="M150 330 L166 282 L182 330 Z"/><path d="M174 330 L194 268 L214 330 Z"/>
      <path d="M318 330 L338 272 L358 330 Z"/><path d="M346 330 L362 290 L378 330 Z"/>
      <path d="M96 330 L108 298 L120 330 Z"/>
    </g>
    <!-- Mar -->
    <rect x="0" y="326" width="512" height="200" fill="url(#sea)"/>
    <rect x="0" y="326" width="512" height="4" fill="#f2a450" opacity="0.55"/>
    <g fill="none" stroke="#7fc4c4" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <path d="M270 352 h70"/><path d="M300 372 h46"/><path d="M150 366 q14 -8 28 0 t28 0 t28 0"/>
      <path d="M190 398 q14 -8 28 0 t28 0 t28 0 t28 0"/><path d="M110 426 q14 -8 28 0 t28 0"/>
      <path d="M300 420 q14 -8 28 0 t28 0 t28 0"/>
    </g>
  </g>

  <!-- Anillo de brújula -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ring)" stroke-width="16"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#e58a3a" stroke-width="3" opacity="0.7"/>
  <g fill="url(#ring)">
    <path d="M256 4 L276 44 L256 36 L236 44 Z"/>
    <path d="M256 508 L276 468 L256 476 L236 468 Z"/>
    <path d="M4 256 L44 236 L36 256 L44 276 Z"/>
    <path d="M508 256 L468 236 L476 256 L468 276 Z"/>
  </g>
  <!-- Estrella del norte -->
  <path d="M256 58 L264 90 L296 98 L264 106 L256 138 L248 106 L216 98 L248 90 Z" fill="#ffe7b0"/>
  <path d="M256 58 L264 90 L256 98 Z M296 98 L264 106 L256 98 Z M256 138 L248 106 L256 98 Z M216 98 L248 90 L256 98 Z" fill="#f2a450"/>
</svg>
